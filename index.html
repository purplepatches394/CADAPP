<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CAD App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="model-tree">
    <div class="tree-header">MODEL TREE</div>
    <div id="tree-list"></div>
  </div>

  <div id="toolbar">
    <button id="rect-tool" class="tool-btn active">Rectangle</button>
    <button id="circle-tool" class="tool-btn">Circle</button>
    <button id="line-tool" class="tool-btn">Line</button>
    <button id="dimension-tool" class="tool-btn">Dimension</button>
    <button id="grid-snap-tool" class="tool-btn">Grid Snap: Off</button>
    <button id="construction-tool" class="tool-btn">Construction: Off</button>
  </div>

  <canvas id="viewport"></canvas>

  <div id="property-panel" class="hidden">
    <div class="property-panel-header">Line Properties</div>

    <label>Length (mm)
      <input id="prop-length" type="number" step="0.1">
    </label>
    <button id="prop-update-length" class="tool-btn">Update Length</button>

    <div class="property-divider"></div>

    <label>Start X <input id="prop-x1" type="number" step="0.1"></label>
    <label>Start Y <input id="prop-y1" type="number" step="0.1"></label>
    <label>End X <input id="prop-x2" type="number" step="0.1"></label>
    <label>End Y <input id="prop-y2" type="number" step="0.1"></label>
    <button id="prop-update-points" class="tool-btn">Update Points</button>
  </div>

  <div id="status-bar">
    <span id="coords">X: 0.0  Y: 0.0</span>
    <span id="zoom-level">Zoom: 100%</span>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
